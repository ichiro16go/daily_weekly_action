name: Jira 週報 Slack通知

# cron-job.org から workflow_dispatch で呼び出すことで定刻実行を実現する。
# GitHub Actions の schedule は遅延が大きいため使用しない。
# 日報のSlack投稿は廃止（Jiraに全データがあるため都度計算で十分）。
on:
  workflow_dispatch:
    inputs:
      report_type:
        description: "実行するレポート種別"
        required: true
        default: "weekly"
        type: choice
        options:
          - weekly

jobs:
  weekly-report:
    name: 週報送信
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      WIP_LIMIT: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 週報を Slack に送信（Block Kit）
        run: python3 jira_monitor.py --weekly --notify slack
