name: Mirror to Bitbucket

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-bitbucket
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (mirror clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push --mirror to Bitbucket
        env:
          BB_EMAIL: ${{ secrets.BITBUCKET_EMAIL }}
          BB_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
          BB_REPO: epark-tech/report-and-dashboard
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          # Bitbucket Cloud は 2026-07-28 に App passwords を廃止。
          # 後継の API tokens は username=メールアドレス / password=トークン。
          # メアドに含まれる @ が URL のユーザー情報区切り文字と衝突するため、
          # http.extraheader で Basic 認証ヘッダを渡す。
          BASIC=$(printf '%s:%s' "$BB_EMAIL" "$BB_API_TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic ${BASIC}" \
              push --mirror "https://bitbucket.org/${BB_REPO}.git"
